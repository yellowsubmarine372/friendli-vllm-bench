[project]
name = "friendli-vllm-bench"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "httpx==0.27.2",
    "numpy==2.1.3",
    "matplotlib==3.9.2",
    "transformers==4.46.0",
    "tqdm==4.66.5",
    "pydantic==2.9.2",
    "tabulate==0.9.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "ruff==0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
